name: iOS core framework

on:
  push:
    branches:
      - feature/ios-port
    paths:
      - 'core/**'
      - 'gradle/libs.versions.toml'
      - 'gradle.properties'
      - 'settings.gradle.kts'
      - '.github/workflows/ios.yml'
  pull_request:
    branches:
      - stable
      - alpha
      - main
    paths:
      - 'core/**'
      - 'gradle/libs.versions.toml'
      - 'gradle.properties'
      - 'settings.gradle.kts'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-core-${{ github.ref }}
  cancel-in-progress: true

jobs:
  xcframework:
    name: Assemble XCFramework (macOS)
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Check out sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify shared core unit tests (JVM)
        run: ./gradlew :core:jvmTest

      - name: Assemble XCFramework
        run: ./gradlew :core:assembleXCFramework

      - name: Upload XCFramework
        uses: actions/upload-artifact@v4
        with:
          name: Core-XCFramework
          path: core/build/XCFrameworks/
          if-no-files-found: error
